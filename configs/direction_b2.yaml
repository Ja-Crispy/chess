# Direction B2: NNUE + Policy Network for Move Ordering

model:
  type: HybridEngine
  params:
    eval_net:
      embedding_dim: 128
      hidden_layers: [1024, 512, 256, 32]
      dropout: 0.1
    policy_net:
      hidden_dim: 256
      num_layers: 3
      dropout: 0.1

data:
  train_path: data/stockfish_annotations/train.h5
  val_path: data/stockfish_annotations/val.h5
  encoding_type: nnue
  batch_size: 512
  num_workers: 4

training:
  num_epochs: 30
  learning_rate: 0.001
  weight_decay: 0.001
  warmup_steps: 500
  optimizer: AdamW
  scheduler: cosine

  loss:
    policy_weight: 0.5
    value_weight: 0.5
    value_loss_type: mse

  save_every: 3
  validate_every: 1
  checkpoint_dir: checkpoints/direction_b2

wandb:
  enabled: true
  project: minimal-chess-models
  run_name: hybrid-nnue-policy-7M
