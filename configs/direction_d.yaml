# Direction D: Parallel Verification Architecture

model:
  type: ParallelVerificationChess
  params:
    hidden_dim: 256
    num_encoder_layers: 4
    num_branches: 5
    num_heads: 8
    max_seq_len: 64
    dropout: 0.1

data:
  train_path: data/stockfish_annotations/train.h5
  val_path: data/stockfish_annotations/val.h5
  encoding_type: piece_centric
  batch_size: 128  # Smaller due to branch computation
  num_workers: 4

training:
  num_epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  optimizer: AdamW
  scheduler: cosine

  loss:
    type: ParallelVerificationLoss
    policy_weight: 0.5
    value_weight: 0.5
    process_reward_weight: 0.3  # Process reward for intermediate reasoning
    value_loss_type: mse

  save_every: 5
  validate_every: 1
  checkpoint_dir: checkpoints/direction_d

wandb:
  enabled: true
  project: minimal-chess-models
  run_name: parallel-verification-24M

inference:
  # Test inference-time scaling
  compute_budgets: [low, medium, high]
  low: {num_branches: 2, verify: false}
  medium: {num_branches: 5, verify: true}
  high: {num_branches: 10, verify: true, num_verify_rounds: 3}
