# Direction B1: Dense NNUE (No Search)

model:
  type: DenseNNUE
  params:
    embedding_dim: 128
    hidden_layers: [1024, 512, 256, 32]
    dropout: 0.1
    use_king_relative: true

data:
  train_path: data/stockfish_annotations/train.h5
  val_path: data/stockfish_annotations/val.h5
  encoding_type: nnue
  batch_size: 512
  num_workers: 4
  max_train_samples: null
  max_val_samples: null

training:
  num_epochs: 30
  learning_rate: 0.001
  weight_decay: 0.001
  warmup_steps: 500
  optimizer: AdamW
  scheduler: cosine

  loss:
    policy_weight: 0.0  # NNUE only predicts value
    value_weight: 1.0
    value_loss_type: mse

  save_every: 3
  validate_every: 1
  checkpoint_dir: checkpoints/direction_b1

wandb:
  enabled: true
  project: minimal-chess-models
  run_name: dense-nnue-5M
